# When a release is published on GitHub, build kbroo-studio.zip (the plugin)
# and kbroo-hello-<version>.zip (the theme) and attach them to the release.
# Sites running Kbroo Studio or Kbroo Hello then offer the update.
name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          want="${TAG#v}"
          header="$(sed -n 's/^ \* Version: *//p' kbroo-studio.php | tr -d '[:space:]')"
          constant="$(sed -n "s/^define( 'KBROO_STUDIO_VERSION', '\(.*\)' );/\1/p" kbroo-studio.php)"
          echo "tag $want, header $header, constant $constant"
          if [ "$header" != "$want" ] || [ "$constant" != "$want" ]; then
            echo "::error::Set Version and KBROO_STUDIO_VERSION in kbroo-studio.php to $want before releasing."
            exit 1
          fi

      - name: Check the theme's version is the same everywhere
        run: |
          css="$(sed -n 's/^Version: *//p' theme/kbroo-hello/style.css | tr -d '[:space:]')"
          constant="$(sed -n "s/^define( 'KBROO_HELLO_VERSION', '\(.*\)' );/\1/p" theme/kbroo-hello/functions.php)"
          stable="$(sed -n 's/^Stable tag: *//p' theme/kbroo-hello/readme.txt | tr -d '[:space:]')"
          echo "theme: style.css $css, constant $constant, readme $stable"
          if [ -z "$css" ] || [ "$css" != "$constant" ] || [ "$css" != "$stable" ]; then
            echo "::error::Set the same Kbroo Hello version in style.css, KBROO_HELLO_VERSION (functions.php) and Stable tag (readme.txt)."
            exit 1
          fi

      - name: Check PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build the zips
        run: bin/build-zip.sh build

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/kbroo-studio.zip build/kbroo-hello-*.zip --clobber
